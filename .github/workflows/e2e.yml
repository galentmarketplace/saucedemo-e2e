# Validates every pull request the AI Testing Marketplace opens against this suite.
# Without this, an agent-authored PR would land in a repository where nothing checks it,
# which is the difference between "a PR exists" and "a PR that is safe to merge".
name: e2e

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: npx playwright test --reporter=list,html
        env:
          # The app under test. Override per environment with a repository variable.
          BASE_URL: ${{ vars.BASE_URL || 'https://www.saucedemo.com' }}
          LOGIN_PATH: ${{ vars.LOGIN_PATH || '/' }}
          # SauceDemo publishes these credentials; a private app should use repository secrets.
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL || 'standard_user' }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD || 'secret_sauce' }}

      # The report is the evidence a reviewer needs when a run goes red.
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
